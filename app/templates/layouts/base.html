<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>{% block title %}HoneyVault{% endblock %} · {{ 'Authenticated demo' if config.get('AUTHENTICATED_APP') else 'Frontend demo' }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
  <script src="{{ url_for('static', filename='js/main.js') }}" defer></script>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/documents.css') }}">
  <script src="{{ url_for('static', filename='js/documents.js') }}" defer></script>
  {% block page_assets %}{% endblock %}
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  {% block body %}{% endblock %}
</body>
</html>
